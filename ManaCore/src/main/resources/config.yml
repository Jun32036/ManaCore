# ---------------- 訊息（MiniMessage 格式） ----------------
messages:
  prefix: '<aqua>◆ </aqua>'
  earned: '<gray>+<green><amount></green> mana <dark_gray>·</dark_gray> <reason></gray>'
  balance-header: '<green>你的 mana：<white><balance></white></green>'
  decay-notice: '<gray>持有超過 <threshold> 的部分，每天會有 <rate> 歸土回生命之樹。</gray>'
  afk: '<yellow>你目前處於 AFK，暫時不會產生 mana。</yellow>'
  no-player: '<red>找不到玩家 <name>（對方需要在線上）。</red>'
  same-ip: '<red>同一個網路的帳號之間無法這樣做。</red>'
  not-enough: '<red>mana 不足：需要 <need>，你有 <have>。</red>'
  cap-reached: '<gray>今天「<reason>」的 mana 已達上限，明天再來吧。</gray>'
  thanks-sent: '<green>你感謝了 <name>。</green>'
  thanks-received: '<green><name> 感謝了你<reason>！</green>'
  thanks-already: '<gray>你今天已經感謝過 <name> 了。</gray>'
  thanks-limit: '<gray>你今天已經感謝了 <max> 個人，明天再繼續吧。</gray>'
  gift-sent: '<green>你送給 <name> <amount> mana。</green>'
  gift-received: '<green><name> 送給你 <amount> mana<note>。</green>'
  donated: '<green>你把 <amount> mana 獻給了生命之樹。</green>'
  tree-stage: '<gold>🌳 生命之樹成長到「<name>」階段！</gold>'
  bought: '<green>用 <price> mana 換到 <item> ×<amount>。</green>'
  inventory-full: '<yellow>背包滿了，物品放在你腳邊。</yellow>'
  decayed: '<gray>今天有 <amount> mana 歸土，流回了生命之樹。</gray>'

# ---------------- 社區工程 ----------------
# 全服一起蓋的公共建設。needs：物品 ID: 數量（或 { amount: 數量, items-per-mana: 幾個換 1 mana }）
# mana-goal：需要投入多少 mana；on-complete：完工時由主控台執行的指令（{name} = 工程名稱）
# 完工後要開新的工程：在這裡新增一項並 /manaadmin reload
projects:
  stone_bridge:
    name: 跨河石橋
    description: 連接主城與東岸農地的石橋，完工後開放公共傳送點
    icon: STONE_BRICKS
    needs:
      STONE_BRICKS: 1280
      OAK_LOG: 256
      LANTERN: { amount: 32, items-per-mana: 4 }
    mana-goal: 500
    on-complete:
      - 'say 跨河石橋完工了！謝謝每一位出力的人。'
  harvest_festival:
    name: 豐收祭市集
    description: 大家一起準備的節慶市集，完工當晚舉辦煙火大會
    icon: HAY_BLOCK
    needs:
      HAY_BLOCK: 192
      PUMPKIN_PIE: { amount: 128, items-per-mana: 8 }
      COOKED_SALMON: { amount: 128, items-per-mana: 8 }
      WHITE_WOOL: 192
    mana-goal: 300
    on-complete:
      - 'say 豐收祭市集完工！今晚在主城廣場有煙火大會。'
