# ---------------- 煉金爐（等價交換） ----------------
alchemy:
  enabled: true
  # 投入時的損耗百分比（換出不再損耗）。0 = 完全等價
  loss-percent: 10
  # 只能換出曾經投入過的物品（像 ProjectE 要先學會）
  learn-required: true

# ---------------- 玩家市集（公定價） ----------------
market:
  enabled: true
  # 賣出手續費（流入生命之樹）
  fee-rate: 0.1
  min-fee: 1
  max-lots-per-player: 10
  # 掛幾天沒賣出就退回
  expire-days: 7

# ---------------- 選單與圖示 ----------------
menu:
  # 蹲下（Shift）時按「交換手持物品」鍵（預設 F）開啟 /mana 選單
  sneak-swap-opens-menu: true
  # true：主選單與表單用伺服器對話框（真正的按鈕、滑桿、文字輸入，需要 1.21.6 以上的客戶端）；
  # false：全部用箱子介面。對話框開啟時，舊版客戶端的玩家可用 /mana chest 開箱子版主選單
  dialogs: true

# ---------------- 介面資源包 ----------------
# 選單的自訂外觀（深色面板、圖示磁磚、重新上色的按鈕與提示框）。玩家進入時會被詢問是否安裝；
# 沒安裝的人看到原版物品的版本，功能完全一樣。
resource-pack:
  enabled: true
  # 強制安裝（拒絕就被踢出）。建議 false
  required: false
  prompt: '<aqua>生生不息</aqua> 的介面資源包：安裝後選單會有自己的樣式。不安裝也能玩。'
  # 自己放到網路空間時填網址（例如 https://example.com/manacore-pack.zip），留空則用下面的內建伺服器
  url: ''
  serve:
    enabled: true
    port: 25580
    # 玩家連線時下載資源包用的主機名稱或 IP：正式服請改成對外的網址（例如 mc.example.com），
    # 主機商若另外分配連接埠也要在 port 改成對外的那個
    public-host: localhost

icons:
  # 代表 mana 的藍色寶石圖示（自訂材質的頭顱，不需要資源包）。
  # 留空 = 用內建的藍色寶石；填 none = 改用鑽石；也可以貼上其他頭顱的材質值（minecraft-heads.com 的 Value）
  mana-texture: ''

# ---------------- 委託板 ----------------
commissions:
  enabled: true
  # 酬謝只能從這幾個數字中選（不講價、不比價）
  reward-tiers: [2, 5, 10, 20, 50]
  # 手續費比例（流入生命之樹），無條件進位，至少 min-fee
  fee-rate: 0.1
  min-fee: 1
  max-open-per-player: 3
  # 物品委託最多徵求幾個（576 = 9 組）
  max-item-amount: 576
  # 超過幾天沒完成就自動取消並退回酬謝
  expire-days: 7

# ---------------- 原版的平行貨幣 ----------------
vanilla:
  # false = 禁止玩家和村民 / 流浪商人交易（綠寶石會繞過 mana 經濟）；管理員不受限
  villager-trading: true

# ---------------- 贈與 ----------------
gift:
  enabled: true
  # 單次贈與上限（0 = 不限）
  max-per-gift: 0

# ---------------- 生命之樹 ----------------
# 歸土與捐獻都會讓生命之樹成長；每到一個階段全服解鎖一項祝福
# commands 由主控台執行，可用 {stage} {name} 佔位
life-tree:
  stages:
    - threshold: 1000
      name: 新芽
      commands:
        - 'say 生命之樹長出了新芽！'
    - threshold: 3000
      name: 枝葉
      commands:
        - 'say 生命之樹枝葉茂盛，今晚有節慶煙火！'
    - threshold: 8000
      name: 開花
      commands:
        - 'say 生命之樹開花了，新的公共傳送點已開放！'
    - threshold: 20000
      name: 結果
      commands:
        - 'say 生命之樹結出果實，全服感謝每一位玩家！'

# ---------------- 生命祭壇（公定價兌換所） ----------------
# 祭壇只「換出」物資，一組一組換（amount 是一次換到的數量，price 是一次的 mana）。
# 1.4.0 起分成分類（altar.shop），每個分類一頁；舊版的 altar.items（含 slot）已不再使用。
