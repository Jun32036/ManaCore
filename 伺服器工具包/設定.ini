# ManaCore 測試伺服器設定（改完存檔，下次啟動生效）

# 伺服器可以使用的記憶體。電腦 8GB 記憶體建議 3G～4G，16GB 以上可以 6G
MEMORY=4G

# 伺服器核心：DivineMC 26.3 build 5（和原本的測試服相同）
# 要換成其他 26.3 的核心（例如 Paper），把網址換掉，並刪除 server\server.jar
SERVER_URL=https://files.mcjars.app/divinemc/26.3/5/server.jar

# Java 25 下載網址（Eclipse Temurin JRE，Windows x64）。電腦已裝 Java 25 以上時不會下載
JAVA_URL=https://api.adoptium.net/v3/binary/latest/25/ga/windows/x64/jre/hotspot/normal/eclipse

# 伺服器停止後是否自動重啟（true / false）
AUTO_RESTART=false
